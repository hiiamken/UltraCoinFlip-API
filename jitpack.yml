jdk:
  - openjdk21

# This image can't build Maven projects on its own: its bundled Maven is broken, Maven Central
# answers 429 to its IP, and /tmp sometimes already holds a half-installed Maven. So the build
# unpacks its own Maven into a directory it owns and pulls dependencies through a mirror.
install:
  - rm -rf "$HOME/maven-dist" && mkdir -p "$HOME/maven-dist"
  - curl -sSL -o "$HOME/maven.tgz" https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz && tar -xzf "$HOME/maven.tgz" -C "$HOME/maven-dist" --strip-components=1 && ls -la "$HOME/maven-dist/boot/"
  - printf '%s' '<settings><mirrors><mirror><id>central-mirror</id><url>https://maven-central.storage-download.googleapis.com/maven2</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' > "$HOME/settings.xml"
  - "$HOME/maven-dist/bin/mvn" -B -s "$HOME/settings.xml" -Dmaven.wagon.http.retryHandler.count=5 clean install -DskipTests
