jdk:
  - openjdk21

# Their image fails every Maven with "ClassNotFoundException: Launcher", including a freshly
# downloaded one, so this run prints what Maven actually sees before trying to build.
install:
  - echo "JAVA_HOME=$JAVA_HOME"; echo "MAVEN_OPTS=$MAVEN_OPTS"; echo "MAVEN_HOME=$MAVEN_HOME"; echo "M2_HOME=$M2_HOME"; echo "CLASSPATH=$CLASSPATH"; which java; java -version
  - curl -sSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz; echo "curl exit=$?"; ls -la /tmp/maven.tar.gz
  - tar -xzf /tmp/maven.tar.gz -C /tmp; echo "tar exit=$?"; ls -la /tmp/apache-maven-3.9.9/boot/
  - java -classpath "/tmp/apache-maven-3.9.9/boot/plexus-classworlds-3.0.3.jar" -Dclassworlds.conf=/tmp/apache-maven-3.9.9/bin/m2.conf -Dmaven.home=/tmp/apache-maven-3.9.9 -Dmaven.multiModuleProjectDirectory="$PWD" org.codehaus.plexus.classworlds.launcher.Launcher -B clean install -DskipTests
