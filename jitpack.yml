jdk:
  - openjdk21

# JitPack's image currently ships a Maven whose boot/plexus-classworlds jar is missing, so both
# their `mvn` and the wrapper that lands on it die with ClassNotFoundException: Launcher.
# Fetching a known-good Maven keeps the build independent of whatever is in the image.
install:
  - curl -sSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
  - tar -xzf /tmp/maven.tar.gz -C /tmp
  - /tmp/apache-maven-3.9.9/bin/mvn -version
  - /tmp/apache-maven-3.9.9/bin/mvn -B clean install -DskipTests
