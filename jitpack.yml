jdk:
  - openjdk21

# The image's own Maven is broken, and Maven Central rate-limits JitPack's IP (429), which also
# truncates downloads. So: fetch Maven and verify the archive before using it, and pull
# dependencies through a Central mirror.
install:
  - curl -sSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz && tar -tzf /tmp/maven.tar.gz > /dev/null && tar -xzf /tmp/maven.tar.gz -C /tmp
  - printf '%s' '<settings><mirrors><mirror><id>central-mirror</id><url>https://maven-central.storage-download.googleapis.com/maven2</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' > /tmp/settings.xml
  - /tmp/apache-maven-3.9.9/bin/mvn -B -s /tmp/settings.xml -Dmaven.wagon.http.retryHandler.count=5 clean install -DskipTests
